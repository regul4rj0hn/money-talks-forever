name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual run (Actions tab or `gh workflow run release.yml -f tag=vX.Y.Z`) to (re)build the release of an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches TOC version
        run: |
          toc=$(sed -n 's/^## Version: *//p' MoneyTalksForever/MoneyTalksForever.toc | tr -d '\r')
          if [ "v$toc" != "$TAG" ]; then
            echo "Tag $TAG does not match TOC version $toc" >&2
            exit 1
          fi

      - name: Run tests (Lua 5.1, as in WoW)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 tests/run.lua
          scripts/check-globals.sh luac5.1

      - name: Build zip
        run: |
          # The zip contains the MoneyTalksForever/ folder, ready to extract into Interface/AddOns/.
          zip -r "MoneyTalksForever-$TAG.zip" MoneyTalksForever

      - name: Extract release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual runs backfill older tags, so they must not take the "Latest" label from a newer release.
          latest=true
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && latest=false
          gh release create "$TAG" "MoneyTalksForever-$TAG.zip" \
            --title "Money Talks Forever $TAG" \
            --notes-file notes.md \
            --latest=$latest
